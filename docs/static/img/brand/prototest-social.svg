<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="card" x1="0" x2="1">
      <stop stop-color="#132d3e"/>
      <stop offset="1" stop-color="#0d2234"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#061a28"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".16"/>

  <g transform="translate(74 65) scale(.25) translate(-235 -225)">
    <path fill="#F7F5EE" d="M301 263V300H383A21 21 0 0 1 404 321A21 21 0 0 1 383 342H333V312H301V342H267V376H301V440H333V376H383A56 56 0 0 0 439 320A56 56 0 0 0 383 264H301Z"/>
    <path fill="#19A8B5" d="M349 400L366 383L392 407L453 346L470 363L392 441Z"/>
  </g>
  <text x="145" y="105" fill="#f7f5ee" font-family="Arial, sans-serif" font-size="30" font-weight="700">ProtoTest</text>
  <text x="75" y="170" fill="#19a8b5" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">INTEGRATION TESTING FOR .NET</text>

  <text x="72" y="255" fill="#dceaf3" font-family="Arial, sans-serif" font-size="58" font-weight="700">One foundation.</text>
  <text x="72" y="322" fill="#19a8b5" font-family="Arial, sans-serif" font-size="58" font-weight="700">Every layer.</text>
  <text x="75" y="375" fill="#90aec2" font-family="Arial, sans-serif" font-size="22">Compose the capabilities a test needs.</text>
  <text x="75" y="407" fill="#90aec2" font-family="Arial, sans-serif" font-size="22">Share one context, lifecycle and portable trace.</text>

  <g font-family="Consolas, monospace" font-size="14" font-weight="700">
    <g transform="translate(690 116)">
      <rect width="380" height="72" rx="9" fill="url(#card)" stroke="#3a9fd6" stroke-opacity=".75"/>
      <text x="24" y="29" fill="#3a9fd6" letter-spacing="2">SCENARIO</text>
      <text x="24" y="53" fill="#dceaf3">REST  →  event  →  database</text>
    </g>
    <g transform="translate(645 211)">
      <rect width="455" height="96" rx="10" fill="#132d3e" stroke="#19a8b5"/>
      <text x="24" y="32" fill="#19a8b5" letter-spacing="2">EXECUTION</text>
      <text x="24" y="64" fill="#f7f5ee" font-family="Arial, sans-serif" font-size="23">ProtoExecutionContext</text>
    </g>
    <g transform="translate(690 330)">
      <rect width="380" height="72" rx="9" fill="url(#card)" stroke="#8f74c7" stroke-opacity=".85"/>
      <text x="24" y="29" fill="#b29ae1" letter-spacing="2">EVIDENCE</text>
      <text x="24" y="53" fill="#dceaf3">checks  +  coverage  +  artifacts</text>
    </g>
    <path d="M872 188V211M872 307V330M872 402V449" stroke="#19a8b5" stroke-width="2"/>
    <g transform="translate(725 449)">
      <rect width="294" height="58" rx="8" fill="#04131d" stroke="#19a8b5"/>
      <text x="23" y="36" fill="#19a8b5" font-size="18">run.prototrace</text>
    </g>
  </g>

  <line x1="72" y1="543" x2="1128" y2="543" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="74" y="574" fill="#7a9cb0" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">PROTOTEST.DEV</text>
  <text x="1128" y="574" fill="#7a9cb0" text-anchor="end" font-family="Consolas, monospace" font-size="15">OPEN SOURCE · MIT</text>
