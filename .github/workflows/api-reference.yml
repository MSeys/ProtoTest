name: API reference

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/api-reference/**"
      - "Directory.Build.targets"
      - ".config/dotnet-tools.json"
      - "eng/build-api-reference.ps1"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/api-reference/**"
      - "Directory.Build.targets"
      - ".config/dotnet-tools.json"
      - "eng/build-api-reference.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build the generated API reference
        shell: pwsh
        run: ./eng/build-api-reference.ps1

      - name: Upload the reference site
        uses: actions/upload-artifact@v4
        with:
          name: prototest-api-reference
          path: artifacts/api-reference
