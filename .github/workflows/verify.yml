name: Verify

on:
  workflow_call:
    inputs:
      upload_packages:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/ProtoTest.SampleApp/Ui/package-lock.json
      - name: Build the sample app UI
        working-directory: samples/ProtoTest.SampleApp/Ui
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sample-app-ui
          path: samples/ProtoTest.SampleApp/Ui/dist
          if-no-files-found: error

  build-test-pack:
    needs: sample-ui
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The browser binaries plus the operating-system libraries they need on a clean image. The
      # in-code InstallBrowsers option covers machines that skip this step.
      - name: Install the Chromium browser for the web tests and demo
        shell: pwsh
        run: |
          dotnet restore tests/ProtoTest.Web.Tests/ProtoTest.Web.Tests.csproj
          dotnet build tests/ProtoTest.Web.Tests/ProtoTest.Web.Tests.csproj --configuration Release --no-restore
          pwsh tests/ProtoTest.Web.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: sample-app-ui
          path: samples/ProtoTest.SampleApp/Ui/dist

      - name: Restore, build, and test every runner
        shell: pwsh
        run: ./eng/test.ps1 -Configuration Release

      # The viewer's recipe traces are regenerated from the demo this job just built and tested, so a
      # recipe filter that matches no test (or a generator break) fails CI. The committed snapshots
      # carry wall-clock timestamps and per-run ids, so this proves generation, not byte equality
      # (records facts/gotchas.md, "Versioning, feeds and gates").
      - name: Regenerate the viewer recipe traces
        shell: pwsh
        run: ./eng/generate-recipe-traces.ps1 -NoBuild

      # The lesson traces are the evidence the Learn lessons embed. Same contract as the recipe
      # traces: the filters, the expected outcomes and the file set are checked, while the run id and
      # timestamps make byte equality impossible.
      - name: Regenerate the lesson traces
        shell: pwsh
        run: ./eng/generate-lesson-traces.ps1 -NoBuild

      # The gate fixtures, now with the Release test binaries the MTP zero-test guards need.
      - name: Test the gate scripts
        shell: pwsh
        run: ./eng/test-gates.ps1

      - name: Verify formatting and analyzers
        shell: pwsh
        run: ./eng/lint.ps1 -NoRestore

      - name: Validate NuGet packages
        shell: pwsh
        run: ./eng/pack.ps1 -Configuration Release -NoBuild -NoRestore

      - name: Validate release plan
        shell: pwsh
        run: ./eng/release.ps1 -Configuration Release -DryRun

      # The template is packed with every run; this proves the package actually installs, generates a
      # project against the just-packed packages for every runner the template offers, and builds and
      # tests each one. The gate fixtures run the same script wherever the packed feed exists.
      - name: Smoke-test the starter template
        shell: pwsh
        run: ./eng/test-template.ps1

      - name: Keep the validated release packages
        if: inputs.upload_packages
        uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: artifacts/packages/*
          if-no-files-found: error

  postgres-sample:
    needs: sample-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: sample-app-ui
          path: samples/ProtoTest.SampleApp/Ui/dist

      # The container path only runs where a container runtime exists, which is why it is its own job.
      - name: Run the Learning demo against a PostgreSQL container
        shell: pwsh
        env:
          ProtoTest__Database: postgres
        run: |
          dotnet restore samples/Northstar.ProtoTest/Northstar.ProtoTest.csproj
          dotnet build samples/Northstar.ProtoTest/Northstar.ProtoTest.csproj --configuration Release --no-restore
          dotnet test samples/Northstar.ProtoTest/Northstar.ProtoTest.csproj --configuration Release --no-build --no-restore --verbosity minimal

  rabbitmq-sample:
    needs: sample-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: sample-app-ui
          path: samples/ProtoTest.SampleApp/Ui/dist

      # The broker path: the adapter's round trips and the Learning demo's event journey only run
      # here. The adapter tests use the job's own service; the sample still owns a container as
      # infrastructure.
      - name: Run the messaging adapter against the RabbitMQ service
        shell: pwsh
        env:
          ProtoTest__Messaging__RabbitMq__ConnectionString: amqp://guest:guest@localhost:5672
        run: |
          dotnet restore tests/ProtoTest.Messaging.RabbitMq.Tests/ProtoTest.Messaging.RabbitMq.Tests.csproj
          dotnet build tests/ProtoTest.Messaging.RabbitMq.Tests/ProtoTest.Messaging.RabbitMq.Tests.csproj --configuration Release --no-restore
          dotnet test tests/ProtoTest.Messaging.RabbitMq.Tests/ProtoTest.Messaging.RabbitMq.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal

      - name: Run the Learning demo against a RabbitMQ container
        shell: pwsh
        env:
          ProtoTest__Messaging__Broker: container
        run: |
          dotnet restore samples/Northstar.ProtoTest/Northstar.ProtoTest.csproj
          dotnet build samples/Northstar.ProtoTest/Northstar.ProtoTest.csproj --configuration Release --no-restore
          dotnet test samples/Northstar.ProtoTest/Northstar.ProtoTest.csproj --configuration Release --no-build --no-restore --verbosity minimal

  docs-and-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            viewer/package-lock.json

      # The content checks run before the builds: they catch removed symbols, docs configuration keys
      # with no source section constant, dead sample links and a stale generated changelog without
      # depending on a Docusaurus build. CI runs the public key list
      # (docs/configuration-keys.json); the private fact sheets add the fact-to-docs direction on a
      # machine that has the records checkout.
      - name: Check the documentation content
        shell: pwsh
        run: ./eng/check-docs.ps1

      # The gate scripts are themselves gated: the fixtures run verify.ps1, check-docs.ps1, lint.ps1
      # and release.ps1 in throwaway repositories. The MTP runner guards skip here (no built test
      # binaries) and run in the build-and-test job below, after the suites are built.
      - name: Test the gate scripts
        shell: pwsh
        run: ./eng/test-gates.ps1

      # Both builds run stylelint, type checks and link checks; they are not part of the dotnet build,
      # so without this job a broken page or type error would only surface after merge.
      - name: Build the docs site
        working-directory: docs
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build the viewer
        working-directory: viewer
        run: |
          npm ci
          npm test
          npm run build

  windows-build-test:
    needs: sample-ui
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - uses: actions/download-artifact@v4
        with:
          name: sample-app-ui
          path: samples/ProtoTest.SampleApp/Ui/dist

      # The scripts are Windows-authored; this job proves the build and the full suite on the same
      # shell the scripts use, so Windows-only path and process behaviour cannot regress unseen.
      # Browser and broker suites skip themselves when no browser or broker is installed here.
      - name: Run the full test suite
        shell: pwsh
        run: ./eng/test.ps1 -Configuration Release
