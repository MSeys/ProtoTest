<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
  <title id="title">ProtoTest blueprint banner</title>
  <desc id="description">ProtoTest wordmark with a constructed PT mark on a technical blueprint grid.</desc>
  <defs>
    <pattern id="small-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#77B9E2" stroke-opacity=".2" stroke-width="1"/>
    </pattern>
    <pattern id="large-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#small-grid)"/>
      <path d="M50 0H0V50" fill="none" stroke="#B8DDF2" stroke-opacity=".3" stroke-width="1.4"/>
    </pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V9" stroke="#FFFFFF" stroke-width="2.1"/>
    </pattern>
    <marker id="dimension-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 4 8 0 6 4 8 8Z" fill="#FFFFFF"/>
    </marker>
    <mask id="mark-breaks">
      <rect width="700" height="700" fill="white"/>
      <rect x="174" y="345" width="78" height="9" fill="black"/>
      <rect x="174" y="430" width="78" height="9" fill="black"/>
    </mask>
  </defs>

  <rect width="1600" height="600" fill="#126AA8"/>
  <rect x="24" y="24" width="1552" height="552" fill="url(#large-grid)" stroke="#D5EDF8" stroke-opacity=".76" stroke-width="2"/>

  <g transform="translate(26 -16) scale(.82)" mask="url(#mark-breaks)">
    <path d="M174 112H333c112 0 181 61 181 158s-69 158-181 158h-81v151h-78V112Zm78 72v172h72c70 0 108-29 108-86s-38-86-108-86h-72Z" fill="url(#hatch)" fill-rule="evenodd" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="92" y="356" width="160" height="72" fill="#126AA8"/>
    <rect x="92" y="356" width="160" height="72" fill="url(#hatch)"/>
    <path d="M252 356H92V428H252" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  </g>
  <g transform="translate(26 -16) scale(.82)" fill="none" stroke="#FFFFFF" opacity=".54">
    <path d="M150 86V602M536 86V452M68 270H548M68 356H548M68 428H548" stroke-dasharray="6 6" stroke-width="2"/>
    <circle cx="252" cy="270" r="86" stroke-width="2"/>
    <path d="M174 78H514M550 112V428M92 458H252" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)" stroke-width="2"/>
    <path d="M174 66V90M514 66V90M538 112H562M538 428H562M92 446V470M252 446V470" stroke-width="2"/>
    <path d="M252 270 313 209" marker-end="url(#dimension-arrow)" stroke-width="2"/>
  </g>
  <path d="m283.48 369.4 50.84 51.66 123.82-138.58" fill="none" stroke="#FFFFFF" stroke-linecap="square" stroke-linejoin="miter" stroke-width="39.36"/>

  <text x="560" y="357" fill="#FFFFFF" font-family="Bahnschrift" font-size="210" font-weight="700" letter-spacing="-5">Proto</text>
  <text x="1064" y="351" fill="url(#hatch)" stroke="#FFFFFF" stroke-width="2.2" paint-order="stroke fill" font-family="Bahnschrift" font-size="198" font-weight="500" letter-spacing="3">Test</text>

  <g fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".62">
    <path d="M1038 160H1520M1038 392H1520" stroke-dasharray="7 7"/>
    <path d="M1048 126V424M1510 126V424"/>
    <path d="M1048 142H1510" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <path d="M1048 132V152M1510 132V152"/>
    <path d="M1530 160V392" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    <path d="M1518 160H1542M1518 392H1542"/>
    <circle cx="1048" cy="142" r="5"/>
    <circle cx="1510" cy="392" r="5"/>
  </g>
</svg>
