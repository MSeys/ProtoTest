name: Log in to Docker Hub
description: Sign in to Docker Hub, and try again when the registry answers with an error.

inputs:
  username:
    description: Docker Hub account name
    required: true
  password:
    description: Docker Hub access token
    required: true

runs:
  using: composite
  steps:
    # Docker Hub sometimes answers GET /v2/ with 500. One attempt then fails the job, so this retries.
    - shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.username }}
        DOCKERHUB_TOKEN: ${{ inputs.password }}
      run: |
        if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
          echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be passed into this workflow."
          exit 1
        fi
        for attempt in 1 2 3 4 5; do
          if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
            exit 0
          fi
          echo "Docker Hub returned an error (attempt $attempt). Waiting before the next try."
          sleep $((attempt * 5))
        done
        exit 1
