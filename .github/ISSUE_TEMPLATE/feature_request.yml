name: Feature request
description: Suggest an improvement or a new integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting. Support is best-effort by a single maintainer, so a clear problem statement matters more than a long proposal. See SUPPORT.md for the full notes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot you do today, or what is harder than it should be?
      placeholder: As a suite author, I want to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should ProtoTest do instead, and what would using it look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you consider, and why do they fall short?
    validations:
      required: false
