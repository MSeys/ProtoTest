name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and print the release plan without pushing to NuGet
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      upload_packages: true

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download the packages verified by this run
        uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: artifacts/packages

      - name: NuGet login (OIDC to temporary key)
        id: login
        # Publishing is tag-gated: a dry run needs no key, and a real publish only
        # happens from the v* tag the release was cut for.
        if: github.ref_type == 'tag' && inputs.dry_run != true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # A dispatch from a branch must never reach nuget.org; versions are immutable, so a
          # mistaken publish cannot be undone. Dry runs stay available everywhere; the real path
          # also re-checks the ref here so the guard cannot be lost with a step condition.
          if ('${{ inputs.dry_run }}' -eq 'true') {
            ./eng/release.ps1 -Configuration Release -DryRun
            exit 0
          }
          if ('${{ github.ref_type }}' -ne 'tag') {
            throw "Refusing to publish from '${{ github.ref }}': this workflow publishes only from a v* tag. Dispatch with dry_run: true to validate without publishing."
          }
          ./eng/release.ps1 -Configuration Release

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag' && inputs.dry_run != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Native command failures are inspected through $LASTEXITCODE, so the create-then-edit fallback
          # never turns into a thrown stderr on newer pwsh versions.
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }

          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $title = "ProtoTest $version"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          # The changelog section is the release notes. A tag without it means the cut step was
          # skipped, and generated notes would quietly ship a release nobody wrote down: fail and
          # name the step instead.
          if (-not (Test-Path -LiteralPath CHANGELOG.md)) {
            throw "CHANGELOG.md is missing; run eng/cut-release.ps1 before tagging $tag."
          }
          $text = Get-Content -LiteralPath CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[?$([regex]::Escape($version))\]?[^\r\n]*\r?\n.*?(?=^##\s|\z)"
          $section = [regex]::Match($text, $pattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md has no '## [$version]' section; run eng/cut-release.ps1 before tagging $tag."
          }
          $section.Value.Trim() | Set-Content -LiteralPath $notes -Encoding utf8

          # A release may already exist - created by hand when the tag was made - so create first and
          # fall back to editing: the workflow owns the title and the notes either way.
          gh release create $tag --verify-tag --title $title --notes-file $notes

          if ($LASTEXITCODE -ne 0) {
            gh release edit $tag --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Neither create nor edit succeeded for release '$tag'." }
          }
