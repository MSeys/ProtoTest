name: CI

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore, build, and test every runner
        shell: pwsh
        run: ./eng/test.ps1 -Configuration Release

      - name: Validate NuGet packages
        shell: pwsh
        run: ./eng/pack.ps1 -Configuration Release -NoBuild -NoRestore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: prototest-packages
          path: artifacts/packages/*.*nupkg
